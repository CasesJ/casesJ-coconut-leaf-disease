services:
  - type: web
    name: coconut-disease-detector
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: INFERENCE_BACKEND
        value: roboflow
      # Enter these values in Render before the first deploy.  `sync: false`
      # keeps secrets and workflow settings out of source control.
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_WORKSPACE
        sync: false
      - key: ROBOFLOW_WORKFLOW_ID
        sync: false
      - key: ROBOFLOW_IMAGE_INPUT_KEY
        value: image
      - key: ROBOFLOW_TIMEOUT_SECONDS
        value: "45"
      - key: MAX_IMAGE_UPLOAD_BYTES
        value: "50000000"
      - key: MAX_IMAGE_UPLOAD_PIXELS
        value: "50000000"
      - key: INFERENCE_DECODE_MAX_PIXELS
        value: "12000000"
      # Render Free has a 512 MiB limit; do not overlap decoded-image pipelines.
      - key: IMAGE_PIPELINE_MAX_CONCURRENCY
        value: "1"
      - key: IMAGE_PIPELINE_QUEUE_SECONDS
        value: "10"
      - key: CLOUDINARY_MAX_IMAGE_PIXELS
        value: "25000000"
      - key: DETECTION_STORAGE_MAX_PIXELS
        value: "12000000"
